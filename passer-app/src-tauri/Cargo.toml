[package]
name = "passer"
version = "1.1.0-beta.4"
description = "Passer - Cross-device clipboard"
authors = ["Walson Argan René"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "passer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# A native "choose a file" window for "Send a file" (used from Rust only).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.7", features = ["multipart"] }
tokio = { version = "1.48.0", features = ["full"] }
arboard = "3.6.1"
local-ip-address = "0.6.7"
tower-http = { version = "0.6.8", features = ["cors"] }
image = "0.25.9"
axum-extra = { version = "0.12.2", features = ["multipart"] }
clipboard-win = "5.4.1"
tempfile = "3.23.0"
zip = "6.0.0"
mdns-sd = "0.11"
dav-server = { version = "0.7" }
rand = "0.8"
base64 = "0.21"
headers = "0.3" 
open = "5.0" # For auth headers handling if needed
# The device network: identity, groups, encrypted connections, permissions.
passer-ffi = { git = "https://github.com/Walson-A/passer-core", rev = "59889693c0131b5ef3cf80110ecca39cc0dfcf10" }
passer-exec = { git = "https://github.com/Walson-A/passer-core", rev = "59889693c0131b5ef3cf80110ecca39cc0dfcf10" }
async-trait = "0.1"
# Expo's push service, to notify a sleeping phone (outbox.rs).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2"
html-escape = "0.2.13"

[target.'cfg(windows)'.dependencies]
# Laptop or desktop (battery present), and the Windows version, for the device network.
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

