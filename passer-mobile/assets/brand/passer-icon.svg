<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Passer</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C3C39"/>
      <stop offset="0.12" stop-color="#2F2F2D"/>
      <stop offset="0.38" stop-color="#252524"/>
      <stop offset="0.68" stop-color="#171717"/>
      <stop offset="1" stop-color="#0B0C0A"/>
    </linearGradient>
    <radialGradient id="plateTop" cx="512" cy="-40" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="376" x2="0" y2="656" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D3E4EA" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#D3E4EA" stop-opacity="0.09"/>
      <stop offset="0.5" stop-color="#D3E4EA" stop-opacity="0.26"/>
      <stop offset="0.68" stop-color="#D3E4EA" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#D3E4EA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="230" x2="0" y2="806" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEFEFE"/>
      <stop offset="0.4" stop-color="#F7F8F6"/>
      <stop offset="0.7" stop-color="#E7E7E6"/>
      <stop offset="1" stop-color="#DBDBDB"/>
    </linearGradient>
    <linearGradient id="facetTop" x1="330" y1="276" x2="294" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6B6B4"/>
      <stop offset="1" stop-color="#F5F5F4"/>
    </linearGradient>
    <linearGradient id="facetBottom" x1="330" y1="758" x2="378" y2="806" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#979795"/>
      <stop offset="1" stop-color="#D6D6D4"/>
    </linearGradient>
    <clipPath id="pClip">
      <path d="M282 230H566A192 192 0 0 1 566 614H378V806H282V518H604A117 117 0 0 0 604 322H378V468H282Z"/>
    </clipPath>
    <filter id="glowWide" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glowTight" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="300" y="280" width="140" height="460">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#plate)"/>
  <rect width="1024" height="1024" fill="url(#plateTop)"/>
  <rect y="376" width="1024" height="280" fill="url(#band)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 516H960M864 459L960 516L864 573" stroke="#BFDDE8" stroke-opacity="0.5" stroke-width="44" filter="url(#glowWide)"/>
    <path d="M56 516H960M864 459L960 516L864 573" stroke="#E6F5FA" stroke-opacity="0.85" stroke-width="26" filter="url(#glowTight)"/>
    <path d="M56 516H960M864 459L960 516L864 573" stroke="#F3FBFD" stroke-width="20"/>
  </g>

  <g filter="url(#lift)">
    <path d="M282 230H566A192 192 0 0 1 566 614H378V806H282V518H604A117 117 0 0 0 604 322H378V468H282Z" fill="url(#face)"/>
  </g>
  <path d="M282 230L378 322H282Z" fill="url(#facetTop)"/>
  <path d="M378 710V806H282Z" fill="url(#facetBottom)"/>

  <g clip-path="url(#pClip)">
    <path d="M378 324V470" fill="none" stroke="#262624" stroke-opacity="0.38" stroke-width="20" filter="url(#soft)"/>
    <circle cx="378" cy="332" r="12" fill="#1E1E1C" fill-opacity="0.45" filter="url(#soft)"/>
    <path d="M378 614V712" fill="none" stroke="#262624" stroke-opacity="0.24" stroke-width="20" filter="url(#soft)"/>
  </g>
</svg>
